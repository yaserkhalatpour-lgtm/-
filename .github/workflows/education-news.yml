name: Education news monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: education-news-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: education-news-telegram-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_agent/requirements.txt
      - name: Restore persistent news queue
        uses: actions/cache@v4
        with:
          path: news_agent/news_seen.sqlite3
          key: education-news-db-${{ github.run_id }}
          restore-keys: |
            education-news-db-
      - name: Install dependencies
        run: pip install -r news_agent/requirements.txt
      - name: Run monitor and publish backlog
        working-directory: news_agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_PUBLISH_ENABLED: ${{ vars.NEWS_PUBLISH_ENABLED || 'false' }}
          NEWS_MIN_SCORE: "4"
          NEWS_MAX_PER_RUN: "8"
        run: python main.py
